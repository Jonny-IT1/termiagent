[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termiagent"
version = "0.1.0"
description = "Universal Terminal AI Coding Agent CLI — Connect to any LLM provider"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OpenSource Contributor", email = "dev@example.com" }
]
keywords = ["ai", "agent", "cli", "llm", "terminal", "coding-assistant", "openai", "claude", "gemini", "ollama", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pathspec>=0.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
termiagent = "termiagent.cli:main"

[project.urls]
Homepage = "https://github.com/example/termiagent"
Repository = "https://github.com/example/termiagent"
Issues = "https://github.com/example/termiagent/issues"
